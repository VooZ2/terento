<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Admin presentation fixture</title>
<style>body{font:14px system-ui;margin:20px}#results{white-space:pre-wrap}iframe{display:block;height:850px;border:1px solid #777;margin-top:16px}</style>
<h1>Admin presentation fixture</h1><p id="status">Running…</p><pre id="results"></pre><iframe title="Admin page under test"></iframe>
<script>
(async () => {
  const frame = document.querySelector('iframe');
  const failures = [], passes = [];
  const check = (condition, label) => (condition ? passes : failures).push(label);
  const load = (name, width) => new Promise((resolve, reject) => {
    frame.style.width = `${width}px`;
    frame.onload = () => setTimeout(() => resolve(frame.contentDocument), 100);
    frame.onerror = reject;
    frame.src = `${name}.html?width=${width}`;
  });
  const noPageOverflow = (doc, label) => check(
    doc.documentElement.scrollWidth <= doc.defaultView.innerWidth + 1, `${label}: no page overflow`
  );
  const noFreshInstallCopy = (doc, label) => check(
    !/Fresh install(?: success|s)?/i.test(doc.body.innerText), `${label}: installation vocabulary`
  );
  try {
    for (const width of [1440, 1024, 768, 390]) {
      let doc = await load('diagnostics', width);
      noFreshInstallCopy(doc, `Diagnostic ${width}`);
      const dialog = doc.querySelector('.diagnostic-detail-dialog');
      check(!!dialog, `Diagnostic ${width}: dialog exists`);
      if (dialog) {
        dialog.showModal();
        const box = dialog.getBoundingClientRect();
        check(box.width > 1080 || width < 1120, `Diagnostic ${width}: desktop width exceeds old 860px limit`);
        check(box.left >= 15 && box.right <= width - 15, `Diagnostic ${width}: viewport edges`);
        const review = dialog.querySelector('.github-review');
        const grid = dialog.querySelector('.diagnostic-actions-grid');
        check(review && grid && Math.abs(review.getBoundingClientRect().width - grid.getBoundingClientRect().width) <= 2,
          `Diagnostic ${width}: GitHub card fills grid (${review?.getBoundingClientRect().width}/${grid?.getBoundingClientRect().width})`);
        const details = dialog.querySelector('.diagnostic-technical-details');
        if (details) {
          details.open = true;
          const style = doc.defaultView.getComputedStyle(details);
          check(parseFloat(style.paddingLeft) >= 11 && parseFloat(style.paddingRight) >= 11,
            `Diagnostic ${width}: technical horizontal padding`);
          const code = details.querySelector('.diagnostic-id code');
          if (code) code.textContent = 'diagnostic-' + 'A'.repeat(320);
          const value = details.querySelector('dd');
          if (value) value.textContent = 'https://example.org/' + 'long-url/'.repeat(50);
          check(dialog.querySelector('.diagnostic-detail-inner').scrollWidth <= dialog.querySelector('.diagnostic-detail-inner').clientWidth + 1,
            `Diagnostic ${width}: long technical content wraps`);
          const summary = details.querySelector('summary');
          summary.focus();
          check(doc.activeElement === summary, `Diagnostic ${width}: disclosure keyboard focus`);
          summary.click();
          check(!details.open, `Diagnostic ${width}: disclosure toggles`);
        }
        const githubDisclosure = review?.querySelector('details');
        if (githubDisclosure) {
          githubDisclosure.open = true;
          check(githubDisclosure.open, `Diagnostic ${width}: GitHub expanded`);
          githubDisclosure.open = false;
          check(!githubDisclosure.open, `Diagnostic ${width}: GitHub collapsed`);
        }
        noPageOverflow(doc, `Diagnostic ${width}`);
        dialog.close();
      }
      doc = await load('overview', width);
      noFreshInstallCopy(doc, `Overview ${width}`);
      const groups = [...doc.querySelectorAll('.overview-kpi-group')];
      check(groups.length === 2, `Overview ${width}: two groups (found ${groups.length}; ${doc.URL})`);
      check(groups.every(group => group.querySelectorAll('.map-statistics-kpi-value').length === 3),
        `Overview ${width}: six metrics`);
      check(groups.every(group => doc.defaultView.getComputedStyle(group.querySelector('.failed')).borderTopWidth === '1px'),
        `Overview ${width}: both Failed dividers`);
      noPageOverflow(doc, `Overview ${width}`);
      doc = await load('installations', width);
      noFreshInstallCopy(doc, `Installations ${width}`);
      doc = await load('statistics', width);
      noFreshInstallCopy(doc, `Statistics ${width}`);
      const table = doc.querySelector('#map-statistics-provider-table table');
      check(table?.querySelectorAll('thead tr').length === 2, `Statistics ${width}: two header rows`);
      check([...table.querySelectorAll('th[scope="colgroup"]')].map(th => th.textContent).join('|') === 'Downloads|Installs|Updates',
        `Statistics ${width}: grouped headers`);
      check(table.querySelectorAll('colgroup').length === 5, `Statistics ${width}: semantic column groups`);
      const rows = Object.fromEntries([...table.querySelectorAll('tbody tr')].map(tr => [tr.cells[0].textContent,
        [...tr.cells].slice(1).map(td => td.textContent.trim())]));
      check(rows.OpenTopoMap?.slice(0, 9).join('|') === '84|4|95.5%|14|6|70%|0|0|—',
        `Statistics ${width}: download/install/update rates`);
      check(rows.MapRando?.slice(3, 6).join('|') === '23|2|92%', `Statistics ${width}: MapRando install rate`);
      check(rows.Freizeitkarte?.slice(3, 6).join('|') === '19|6|76%', `Statistics ${width}: Freizeitkarte install rate`);
      check(rows.BBBike?.slice(3, 6).join('|') === '8|1|88.9%', `Statistics ${width}: BBBike install rate`);
      check(rows.custom?.slice(0, 9).join('|') === '0|0|—|20|3|87.0%|0|0|—',
        `Statistics ${width}: custom acquisition stays absent`);
      const wrap = table.closest('.table-wrap');
      if (width <= 768) check(wrap.scrollWidth > wrap.clientWidth, `Statistics ${width}: table scrolls locally (${wrap.scrollWidth}/${wrap.clientWidth}; table ${table.getBoundingClientRect().width}; min ${doc.defaultView.getComputedStyle(table).minWidth}; ${doc.URL})`);
      noPageOverflow(doc, `Statistics ${width}`);
    }
  } catch (error) { failures.push(error.stack || String(error)); }
  document.querySelector('#status').textContent = failures.length ? `FAIL: ${failures.length} of ${passes.length + failures.length}` : `PASS: ${passes.length} checks`;
  document.querySelector('#results').textContent = failures.length ? failures.join('\n') : passes.join('\n');
  document.body.dataset.result = failures.length ? 'fail' : 'pass';
})();
</script></html>
