name: Deploy catalog API

on:
  push:
    branches:
      - beta
    paths:
      - "backend/catalog-api/src/**"
      - "backend/catalog-api/Dockerfile"
      - "backend/catalog-api/pyproject.toml"
      - ".github/workflows/deploy-catalog-api.yml"
      - "scripts/infra/check-admin-boundary.py"
      - "Tests/admin-access-boundary-tests.py"
      - ".github/workflows/publish-vps-images.yml"
      - "scripts/infra/deploy-vps-image.sh"
      - "scripts/ci_http.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-api-production
  cancel-in-progress: false

jobs:
  catalog-contract-scope:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != push ] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE_SHA" HEAD | grep -Eq '^(contracts/|backend/catalog-api/src/terento_catalog/(catalog\.py|db\.py|http_api\.py|config\.py|provider_catalog\.py|maprando\.py|maprando_geography\.py|contour_source\.py|collect\.py|collectors/|migrations/)|Packaging/validate-live-map-catalog\.sh|app/TerentoCore/)'; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'required=false' >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: Backend regression suite
    uses: ./.github/workflows/reusable-catalog-api-quality.yml

  publish:
    needs: tests
    if: github.repository == 'VooZ2/terento' && github.ref == 'refs/heads/beta'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-vps-images.yml
    with:
      role: api

  deploy:
    needs: publish
    if: github.repository == 'VooZ2/terento' && github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: rukas-api
    env:
      OPERATIONS_INGEST_SECRET: ${{ secrets.TERENTO_OPERATIONS_INGEST_SECRET }}
      TERENTO_ADMIN_ACCESS_REQUIRED: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Deploy immutable API image through its scoped account
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: bash scripts/infra/deploy-vps-image.sh api

      - name: Validate admin edge boundary checker
        run: python3 Tests/admin-access-boundary-tests.py

      - name: Verify public catalog API
        shell: bash
        run: |
          set -euo pipefail

          retry_curl() { python3 scripts/ci_http.py "$@"; }

          health="$(retry_curl health --fail --silent --show-error --compressed --connect-timeout 5 --max-time 20 \
            https://api.terento.app/health)"
          maps="$(retry_curl map-catalog --fail --silent --show-error --compressed --connect-timeout 5 --max-time 60 \
            https://api.terento.app/maps/catalog.json)"
          devices="$(retry_curl device-catalog --fail --silent --show-error --compressed --connect-timeout 5 --max-time 30 \
            https://api.terento.app/devices/catalog.json)"
          python3 scripts/infra/check-admin-boundary.py
          deletion_body_file="$RUNNER_TEMP/terento-compatibility-delete-contract.json"
          deletion_status="$(retry_curl compatibility-delete-contract --silent --show-error --connect-timeout 5 --max-time 20 \
            -H 'Content-Type: application/json' --data '{}' -X DELETE \
            -o "$deletion_body_file" -w '%{http_code}' \
            https://api.terento.app/compatibility/events)"
          deletion_body="$(cat "$deletion_body_file")"
          if ! jq -e '.status == "ok"' <<<"$health" >/dev/null \
            || ! grep -Fq '"catalogVersion"' <<<"$maps" \
            || ! jq -e '.schemaVersion == 2 and (.providers | type == "array") and any(.providers[]; .id == "freizeitkarte")' <<<"$maps" >/dev/null \
            || ! grep -Fq '"catalogVersion"' <<<"$devices" \
            || [ "$deletion_status" != "405" ] \
            || ! jq -e '.error == "deletion_not_supported"' <<<"$deletion_body" >/dev/null; then
            printf '%s\n' "Public catalog verification failed" >&2
            printf 'compatibility DELETE status=%s body=%s\n' "$deletion_status" "$deletion_body" >&2
            exit 1
          fi

          compatibility_script="$(retry_curl compatibility-script --fail --silent --show-error --connect-timeout 5 --max-time 20 \
            https://terento.app/compatibility/compatibility.js)"
          grep -Fq 'https://api.terento.app' <<<"$compatibility_script"
          operations_status="$(retry_curl operations-unauthorized --silent --show-error --connect-timeout 5 --max-time 20 \
            -o /dev/null -w '%{http_code}' -X POST https://api.terento.app/internal/operations/observations)"
          test "$operations_status" = "401"
          retry_curl operations-report-context --fail --silent --show-error --connect-timeout 5 --max-time 30 \
            -H "Authorization: Bearer $OPERATIONS_INGEST_SECRET" \
            https://api.terento.app/internal/operations/report-context \
            | jq -e '.schemaVersion == 1 and (.providers | type == "array")' >/dev/null

      - name: Retain API deployment health
        shell: bash
        run: |
          set -euo pipefail
          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n \
            --arg observationId "deployment-catalog-api-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --arg observedAt "$observed_at" --arg sourceRunId "$GITHUB_RUN_ID" \
            --arg sourceRunUrl "$run_url" --arg commitSha "$GITHUB_SHA" \
            '{schemaVersion:1, observationId:$observationId, kind:"DEPLOYMENT",
              component:"catalog-api", status:"HEALTHY", observedAt:$observedAt,
              sourceRunId:$sourceRunId, sourceRunUrl:$sourceRunUrl, commitSha:$commitSha,
              summary:"Catalog API deployment and public health verification passed.",
              details:{migration:"success", database:"success", api_health:"success", catalog_contract:"success"}}' \
            > "$RUNNER_TEMP/terento-api-deployment.json"
          python3 scripts/ci_http.py --observation deployment-observation --fail --silent --show-error --connect-timeout 5 --max-time 30 \
            -H "Authorization: Bearer $OPERATIONS_INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/terento-api-deployment.json" \
            https://api.terento.app/internal/operations/observations

  verify-release-client-contract:
    name: Verify deployed catalog with release client
    needs: [deploy, catalog-contract-scope]
    if: needs.catalog-contract-scope.outputs.required == 'true'
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate deployed catalog against the native client
        run: /bin/zsh Packaging/validate-live-map-catalog.sh
