name: Live map catalog contract

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-map-catalog-contract
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate live catalog against the native client
        run: /bin/zsh Packaging/validate-live-map-catalog.sh
