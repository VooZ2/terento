name: Catalog API quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Backend regression and integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: terento_ci
          POSTGRES_USER: terento_ci
          POSTGRES_PASSWORD: terento_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U terento_ci -d terento_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install catalog API dependencies
        run: python -m pip install --disable-pip-version-check -e "backend/catalog-api[test]"
      - name: Run backend suite
        run: Tests/run-backend-tests.sh
      - name: Validate PostgreSQL migrations
        env:
          DATABASE_URL: postgresql://terento_ci:terento_ci@127.0.0.1:5432/terento_ci
        run: |
          set -euo pipefail
          terento-catalog-migrate
          terento-catalog-migrate
          python -c 'from terento_catalog.config import Settings; from terento_catalog.db import Database; settings = Settings.from_env(); assert Database(settings.database_url).health()'
      - name: Build catalog API container
        run: docker build --pull=false -t terento-catalog-api:ci backend/catalog-api
