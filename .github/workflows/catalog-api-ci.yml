name: Catalog API CI

on:
  push:
    branches:
      - beta
      - main
    paths:
      - "backend/catalog-api/**"
      - "Tests/run-backend-tests.sh"
      - "Tests/node-runtime.sh"
      - ".github/workflows/catalog-api-ci.yml"
  pull_request:
    branches:
      - beta
      - main
    paths:
      - "backend/catalog-api/**"
      - "Tests/run-backend-tests.sh"
      - "Tests/node-runtime.sh"
      - ".github/workflows/catalog-api-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Backend regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
      - name: Install catalog API dependencies
        run: python -m pip install --disable-pip-version-check -e backend/catalog-api
      - name: Run backend regression suite
        run: Tests/run-backend-tests.sh
