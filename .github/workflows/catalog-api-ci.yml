name: Catalog API CI

on:
  push:
    branches:
      - beta
      - main
    paths:
      - "backend/catalog-api/**"
      - "Tests/run-backend-tests.sh"
      - "Tests/node-runtime.sh"
      - ".github/workflows/catalog-api-ci.yml"
  pull_request:
    branches:
      - beta
      - main
    paths:
      - "backend/catalog-api/**"
      - "Tests/run-backend-tests.sh"
      - "Tests/node-runtime.sh"
      - ".github/workflows/catalog-api-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Backend regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install catalog API dependencies
        run: python -m pip install --disable-pip-version-check -e backend/catalog-api
      - name: Run backend regression suite
        run: Tests/run-backend-tests.sh
