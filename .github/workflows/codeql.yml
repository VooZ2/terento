name: CodeQL

on:
  push:
    branches:
      - beta
      - main
    paths:
      - "**/*.py"
      - "**/pyproject.toml"
      - "**/requirements*.txt"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches:
      - beta
      - main
    paths:
      - "**/*.py"
      - "**/pyproject.toml"
      - "**/requirements*.txt"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "15 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          languages: python
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d
