name: Publish VPS image

on:
  workflow_call:
    inputs:
      role:
        required: true
        type: string
      candidate_source_ref:
        required: false
        type: string
        default: ''
      candidate_source_sha:
        required: false
        type: string
        default: ''
    outputs:
      digest:
        description: Immutable digest of the tested image at the caller commit
        value: ${{ jobs.publish.outputs.digest }}
      migration_062_sha256:
        description: SHA-256 label value for migration 062 (API images only)
        value: ${{ jobs.publish.outputs.migration_062_sha256 }}
      migrate_py_sha256:
        description: SHA-256 label value for the migration runner (API images only)
        value: ${{ jobs.publish.outputs.migrate_py_sha256 }}
      build_timestamp:
        description: UTC image-build start timestamp
        value: ${{ jobs.publish.outputs.build_timestamp }}

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.repository == 'VooZ2/terento' &&
      (
        (inputs.candidate_source_ref == '' && inputs.candidate_source_sha == '' && github.ref == 'refs/heads/beta') ||
        (
          inputs.candidate_source_ref == 'refs/heads/terento/062-production-candidate' &&
          inputs.candidate_source_sha == github.sha &&
          github.ref == inputs.candidate_source_ref &&
          github.workflow_ref == 'VooZ2/terento/.github/workflows/build-catalog-migration-candidate.yml@refs/heads/terento/062-production-candidate'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      migration_062_sha256: ${{ steps.image.outputs.migration_062_sha256 }}
      migrate_py_sha256: ${{ steps.image.outputs.migrate_py_sha256 }}
      build_timestamp: ${{ steps.image.outputs.build_timestamp }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release source and target
        env:
          ROLE: ${{ inputs.role }}
          CANDIDATE_SOURCE_REF: ${{ inputs.candidate_source_ref }}
          CANDIDATE_SOURCE_SHA: ${{ inputs.candidate_source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ROLE" == site || "$ROLE" == api ]]
          [[ "$GITHUB_REPOSITORY" == "VooZ2/terento" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
          git show --check --oneline "$GITHUB_SHA"
          if [[ -n "$CANDIDATE_SOURCE_REF" || -n "$CANDIDATE_SOURCE_SHA" ]]; then
            [[ "$ROLE" == api ]]
            [[ "$CANDIDATE_SOURCE_REF" == "refs/heads/terento/062-production-candidate" ]]
            [[ "$CANDIDATE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$GITHUB_REF" == "$CANDIDATE_SOURCE_REF" ]]
            [[ "$GITHUB_SHA" == "$CANDIDATE_SOURCE_SHA" ]]
            [[ "$GITHUB_WORKFLOW_REF" == "VooZ2/terento/.github/workflows/build-catalog-migration-candidate.yml@refs/heads/terento/062-production-candidate" ]]
            remote_source_sha="$(git ls-remote --exit-code --refs https://github.com/VooZ2/terento.git "$CANDIDATE_SOURCE_REF" | cut -f1)"
            [[ "$remote_source_sha" == "$CANDIDATE_SOURCE_SHA" ]]
          else
            [[ "$GITHUB_REF" == "refs/heads/beta" ]]
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Validate public site and release contracts
        if: inputs.role == 'site'
        run: |
          set -euo pipefail
          Tests/run-site-tests.sh
          Tests/run-release-documentation-tests.sh
          Tests/run-release-legal-content-tests.sh
      - name: Build and publish immutable release
        id: image
        env:
          ROLE: ${{ inputs.role }}
          CANDIDATE_SOURCE_SHA: ${{ inputs.candidate_source_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/terento-docker
        shell: bash
        run: |
          set -euo pipefail
          case "$ROLE" in
            site) image=ghcr.io/vooz2/terento-site; context=.; dockerfile=site-deploy/Dockerfile ;;
            api) image=ghcr.io/vooz2/terento-catalog; context=backend/catalog-api; dockerfile=backend/catalog-api/Dockerfile ;;
            *) exit 64 ;;
          esac
          image_tag="sha-$GITHUB_SHA"
          if [[ -n "${CANDIDATE_SOURCE_SHA:-}" ]]; then
            # A unique run-scoped SHA tag prevents a rerun from retargeting an
            # already-published candidate tag. Refuse if the active tag exists;
            # the receipt binds the result by immutable digest.
            image_tag="candidate-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            existing_tags="$(gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              '/users/VooZ2/packages/container/terento-catalog/versions?per_page=100&state=active' \
              --jq '.[].metadata.container.tags[]?')"
            if printf '%s\n' "$existing_tags" | grep -Fqx -- "$image_tag"; then
              printf 'Refusing to reuse previously published candidate tag: %s\n' "$image_tag" >&2
              exit 1
            fi
          fi
          build_timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          migration_062_sha=""
          migrate_py_sha=""
          image_labels=(
            --label "org.opencontainers.image.source=https://github.com/VooZ2/terento"
            --label "org.opencontainers.image.revision=$GITHUB_SHA"
            --label "org.opencontainers.image.licenses=GPL-3.0-or-later"
          )
          if [[ "$ROLE" == api ]]; then
            migration_062="backend/catalog-api/src/terento_catalog/migrations/062_reconcile_installation_statistics_schema.sql"
            migrate_py="backend/catalog-api/src/terento_catalog/migrate.py"
            [[ -f "$migration_062" && -f "$migrate_py" ]]
            migration_062_sha="$(sha256sum "$migration_062" | cut -d ' ' -f 1)"
            migrate_py_sha="$(sha256sum "$migrate_py" | cut -d ' ' -f 1)"
            [[ "$migration_062_sha" =~ ^[0-9a-f]{64}$ && "$migrate_py_sha" =~ ^[0-9a-f]{64}$ ]]
            image_labels+=(
              --label "io.terento.migration.062.sha256=$migration_062_sha"
              --label "io.terento.migrate.py.sha256=$migrate_py_sha"
            )
          fi
          docker build --platform linux/amd64 \
            "${image_labels[@]}" \
            --file "$dockerfile" --tag "$image:$image_tag" "$context"
          local_image_id="$(docker image inspect --format '{{.Id}}' "$image:$image_tag")"
          [[ "$local_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$image:$image_tag"
          pull_succeeded=false
          for attempt in 1 2 3 4 5; do
            if docker pull "$image:$image_tag"; then
              pull_succeeded=true
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              printf 'GHCR pull attempt %s/5 failed after push; retrying\n' "$attempt" >&2
              sleep $((attempt * 2))
            fi
          done
          [[ "$pull_succeeded" == true ]]
          pulled_image_id="$(docker image inspect --format '{{.Id}}' "$image:$image_tag")"
          [[ "$pulled_image_id" == "$local_image_id" ]]
          reference="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image:$image_tag")"
          [[ "$reference" == "$image"@sha256:* ]]
          digest="${reference#*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'migration_062_sha256=%s\n' "$migration_062_sha" >> "$GITHUB_OUTPUT"
          printf 'migrate_py_sha256=%s\n' "$migrate_py_sha" >> "$GITHUB_OUTPUT"
          printf 'build_timestamp=%s\n' "$build_timestamp" >> "$GITHUB_OUTPUT"
          printf '%s\n' "### $image" "Commit: $GITHUB_SHA" "Candidate tag: $image_tag" "Digest: $reference" >> "$GITHUB_STEP_SUMMARY"
