name: Refresh public compatibility snapshot

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: refresh-compatibility-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'VooZ2/terento'
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: beta

      - name: Refresh snapshot and generated pages
        run: python3 scripts/update-compatibility-snapshot.py

      - name: Validate public compatibility output
        run: |
          node Tests/shared-compatibility-data-tests.cjs
          node Tests/site-compatibility-refresh-tests.cjs
          git diff --check

      - name: Detect factual changes
        id: diff
        run: |
          if git diff --quiet -- site/compatibility/public-models.snapshot.json \
            site/compatibility/index.html \
            site/de/compatibility/index.html \
            site/fr/compatibility/index.html \
            site/pl/compatibility/index.html \
            site/cs/compatibility/index.html \
            site/it/compatibility/index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push factual changes
        id: commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "terento-bot"
          git config user.email "actions@terento.app"
          git add site/compatibility/public-models.snapshot.json \
            site/compatibility/index.html \
            site/de/compatibility/index.html \
            site/fr/compatibility/index.html \
            site/pl/compatibility/index.html \
            site/cs/compatibility/index.html \
            site/it/compatibility/index.html
          git commit -m "chore: refresh compatibility snapshot"
          git push origin HEAD:beta
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch and wait for production site deployment
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail

          gh workflow run deploy-site.yml --ref beta

          deploy_run_id=""
          for attempt in $(seq 1 60); do
            deploy_run_id="$(gh run list \
              --workflow deploy-site.yml \
              --branch beta \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha \
              | jq -r --arg sha "$COMMIT_SHA" 'map(select(.headSha == $sha)) | .[0].databaseId // empty')"
            if [ -n "$deploy_run_id" ]; then
              break
            fi
            sleep 5
          done

          test -n "$deploy_run_id"
          gh run view "$deploy_run_id" --json url --jq .url
          gh run watch "$deploy_run_id" --interval 30 --exit-status
