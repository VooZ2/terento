name: Refresh public compatibility snapshot

on:
  schedule:
    # Run after the 03:00 UTC provider/catalog collection cycle.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-compatibility-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh evidence-backed model list
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out beta
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: beta
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Check the live compatibility evidence
        id: refresh
        shell: bash
        run: |
          set -euo pipefail
          snapshot="site/compatibility/public-models.snapshot.json"
          before="$(git hash-object "$snapshot")"
          python scripts/update-compatibility-snapshot.py
          after="$(git hash-object "$snapshot")"
          if [[ "$before" == "$after" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Regenerate localized compatibility pages
        if: steps.refresh.outputs.changed == 'true'
        run: python scripts/build-compatibility-pages.py

      - name: Run public-site regression suite
        if: steps.refresh.outputs.changed == 'true'
        run: python Tests/run-test-suite.py site

      - name: Verify the generated change is narrowly scoped
        if: steps.refresh.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          allowed_paths=(
            "site/compatibility/public-models.snapshot.json"
            "site/compatibility/index.html"
            "site/de/compatibility/index.html"
            "site/fr/compatibility/index.html"
            "site/pl/compatibility/index.html"
            "site/cs/compatibility/index.html"
            "site/it/compatibility/index.html"
          )
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            allowed=false
            for expected in "${allowed_paths[@]}"; do
              if [[ "$path" == "$expected" ]]; then
                allowed=true
                break
              fi
            done
            if [[ "$allowed" != true ]]; then
              echo "Unexpected generated path: $path" >&2
              exit 1
            fi
          done < <(git diff --name-only)

      - name: Propose the refreshed snapshot through protected-branch review
        if: steps.refresh.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="terento/compatibility-snapshot-${GITHUB_RUN_ID}"
          existing="$(gh pr list --base beta --state open --search 'chore: refresh compatibility snapshot in:title' --json url --jq '.[0].url // empty')"
          if [[ -n "$existing" ]]; then
            printf 'Snapshot review already pending: %s\n' "$existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git switch -c "$branch"
          git add -- \
            site/compatibility/public-models.snapshot.json \
            site/compatibility/index.html \
            site/de/compatibility/index.html \
            site/fr/compatibility/index.html \
            site/pl/compatibility/index.html \
            site/cs/compatibility/index.html \
            site/it/compatibility/index.html
          if git diff --cached --quiet; then
            echo "No staged compatibility changes remain."
            exit 0
          fi
          git diff --cached --check
          git config user.name "Terento automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh compatibility snapshot"
          git push origin "HEAD:$branch"
          gh pr create --base beta --head "$branch" --title "chore: refresh compatibility snapshot" --body "Refresh approved public evidence and six generated compatibility pages. The public-site suite passed in this refresh run. Review and merge through normal branch protection; no evidence approval or branch-protection bypass is performed. GitHub-token PRs do not start push/PR CI automatically: an owner must run required checks before merging."
          printf 'Snapshot PR created. Required checks, review and merge are needed before publication.\n' >> "$GITHUB_STEP_SUMMARY"
