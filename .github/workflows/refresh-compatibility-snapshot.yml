name: Refresh public compatibility snapshot

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: refresh-compatibility-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'VooZ2/terento'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out beta
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: beta
          fetch-depth: 0

      - name: Refresh snapshot and generated pages
        run: |
          python3 scripts/ci_http.py compatibility-snapshot --fail --silent --show-error \
            --connect-timeout 5 --max-time 30 \
            'https://api.terento.app/compatibility/public/models.json?limit=500' \
            -o "$RUNNER_TEMP/compatibility-live.json"
          python3 scripts/update-compatibility-snapshot.py --input "$RUNNER_TEMP/compatibility-live.json"

      - name: Validate public compatibility output
        run: |
          node Tests/shared-compatibility-data-tests.cjs
          node Tests/site-compatibility-refresh-tests.cjs
          git diff --check

      - name: Detect factual changes
        id: diff
        run: |
          if git diff --quiet -- site/compatibility/public-models.snapshot.json \
            site/compatibility/index.html \
            site/de/compatibility/index.html \
            site/fr/compatibility/index.html \
            site/pl/compatibility/index.html \
            site/cs/compatibility/index.html \
            site/it/compatibility/index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Integrate factual refresh through protected PR and deploy once
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/integrate-compatibility-refresh.py
