name: Swift CI

on:
  push:
    branches:
      - beta
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - beta
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-14
    defaults:
      run:
        working-directory: lab/native-connectivity-poc
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select Swift 6 toolchain
        run: |
          xcode_16_path=$(find /Applications -maxdepth 1 -type d -name "Xcode_16*.app" | sort | tail -n 1)
          if [ -z "$xcode_16_path" ]; then echo "Xcode 16 was not found on the runner"; exit 1; fi
          sudo xcode-select -s "$xcode_16_path/Contents/Developer"
          swift --version
      - name: Install libmtp
        run: |
          brew untap aws/tap || true
          brew install libmtp
      - name: Build and test
        run: |
          set -euo pipefail
          export LIBMTP_PREFIX="$(brew --prefix libmtp)"
          export CLANG_MODULE_CACHE_PATH="$RUNNER_TEMP/terento-clang-module-cache"
          swift build
          for test_script in Tests/run-*.sh; do
            echo "=== ${test_script} ==="
            "${test_script}"
          done
      - name: Validate live catalog against release client
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          /bin/zsh Packaging/validate-live-map-catalog.sh
      - name: Validate public website
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          Tests/run-guide-generator-parity-tests.sh
          Tests/run-structured-data-tests.sh
          Tests/run-guide-content-tests.sh
          Tests/run-public-page-layout-contract-tests.sh
      - name: Validate non-app brand tokens
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 scripts/generate-brand-tokens.py --check
          Tests/run-brand-contract-tests.sh
