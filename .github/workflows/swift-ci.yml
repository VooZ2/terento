name: Swift CI

on:
  push:
    branches:
      - beta
      - main
  pull_request:
    branches:
      - beta
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-14
    defaults:
      run:
        working-directory: lab/native-connectivity-poc
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Select Swift 6 toolchain
        run: |
          xcode_16_path=20 20 12 61 79 80 81 98 33 100 204 250 395 398 399 400find /Applications -maxdepth 1 -type d -name "Xcode_16*.app" | sort | tail -n 1)
          if [ -z "" ]; then echo "Xcode 16 was not found on the runner"; exit 1; fi
          sudo xcode-select -s "/Contents/Developer"
          swift --version
      - name: Install libmtp
        run: brew install libmtp
      - name: Build and test
        run: |
          export LIBMTP_PREFIX=$(brew --prefix libmtp)
          export CLANG_MODULE_CACHE_PATH=$RUNNER_TEMP/terento-clang-module-cache
          swift build
          swift test