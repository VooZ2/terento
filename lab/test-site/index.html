<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#F7F3EC">
    <meta name="robots" content="noindex, nofollow">
    <title>Terento</title>
    <link rel="icon" href="/assets/logo-sky.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/landing.css">
  </head>
  <body>
    <main class="holding-page">
      <header class="masthead" aria-label="Terento">
        <div class="brand-lockup">
          <img src="/assets/logo-sky.svg" alt="" width="38" height="45">
          <span>Terento</span>
        </div>
      </header>

      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <h1 id="hero-title">We’re mapping the trail.</h1>
          <p>Terento is still taking shape.</p>
        </div>

        <div class="hero-visual" aria-hidden="true">
          <div class="waypoint-trail">
            <span class="waypoint"></span>
          </div>
          <img
            src="/assets/landing-1600.png"
            srcset="/assets/landing-640.png 640w, /assets/landing-960.png 960w, /assets/landing-1600.png 1600w"
            sizes="(max-width: 720px) calc(100vw - 32px), min(92vw, 1600px)"
            width="1600"
            height="569"
            alt=""
            fetchpriority="high"
            decoding="async"
          >
        </div>

      </section>
    </main>
  </body>
</html>
